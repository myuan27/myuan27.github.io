{% assign publication = include.publication %}
<article>
  <h3 class="publication__title">
    <a href="{{ publication.url | escape }}">{{ publication.title | escape }}</a>
  </h3>
  <div class="publication__authors">{{ publication.authors | markdownify }}</div>
  <div class="publication__meta">
    <span class="publication__venue{% if publication.venue == 'arXiv preprint' %} publication__venue--preprint{% endif %}">
      <span class="publication__venue-name">{{ publication.venue | escape }}</span>
      <span class="publication__year">{{ publication.year }}</span>
    </span>
    {% if publication.details %}
    <span class="publication__details{% if publication.details == 'Under review' or publication.details == 'Accepted' or publication.details == 'In press' %} publication__details--status{% endif %}{% if publication.details == 'Accepted' or publication.details == 'In press' %} publication__details--accepted{% endif %}">{{ publication.details | escape }}</span>
    {% endif %}
    {% if publication.pdf_url %}
    <a class="publication__pdf" href="{{ publication.pdf_url | escape }}" target="_blank" rel="noopener noreferrer" aria-label="PDF: {{ publication.title | escape }} (opens in a new tab)">
      <i class="fa-solid fa-file-pdf publication__pdf-icon" aria-hidden="true"></i>
      PDF
    </a>
    {% endif %}
  </div>
</article>
