- id: "2025-06-reglermotet"
  date: "2025-06-01T00:00:00Z"
  display_date: "2025.06"
  title: "Battery safety and recycling at Reglermötet 2025"
  content: "I will be presenting research on battery safety and recycling at the Swedish Control Conference (Reglermötet 2025) in Lund, Sweden. Excited to discuss sustainable energy applications in control systems."

- id: "2025-03-retired-battery-ecc"
