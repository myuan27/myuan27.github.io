# Shared by the homepage and Atom feed. Keep entries in newest-first order.
# Dates have month precision; the first day is used only for Atom timestamps.

- id: "2026-11-battery-filter-rl"
  date: "2026-11-01T00:00:00Z"
  display_date: "2026.11"
  title: "Battery fast-charging paper accepted by IEEE TTE"
  content: "Our paper \"[Filter-Augmented Reinforcement Learning for Battery Fast Charging with State of Health and Plating-Aware Reward Design](https://arxiv.org/abs/2610.22787)\" has been accepted for publication in *IEEE Transactions on Transportation Electrification*. Congratulations to all co-authors!"

- id: "2026-11-ajcai-new-faculty"
  date: "2026-11-01T00:00:00Z"
  display_date: "2026.11"
  title: "New Faculty Highlights presentation at AJCAI 2026"
  content: "I will attend the [Australasian Joint Conference on Artificial Intelligence (AJCAI 2026)](https://ajcai26.org/) in Auckland, New Zealand, from 27 to 30 November and give a **New Faculty Highlights Presentation**. I hope to see you there!"

- id: "2026-11-air-conference"
  date: "2026-11-01T00:00:00Z"
  display_date: "2026.11"
  title: "Research talk and panel at the AIR conference"
  content: "I will give a research talk and participate in a panel discussion on “If AI can do research, what are scholars for?” at the [Artificial Intelligence Researchers Association conference](https://www.ainz.ai/) in Dunedin, New Zealand, on 23–24 November."

- id: "2026-07-home-energy-rl"
  date: "2026-07-01T00:00:00Z"
  display_date: "2026.07"
  title: "Home energy management paper accepted by IEEE TSTE"
  content: "Our paper, “[Reinforcement Learning-based Home Energy Management with Heterogeneous Batteries and Stochastic EV Behaviour](https://ieeexplore.ieee.org/document/11641052),” has been accepted for publication in *IEEE Transactions on Sustainable Energy*. Congratulations to all co-authors!"

- id: "2026-07-contouring-input-delay"
  date: "2026-07-01T00:00:00Z"
  display_date: "2026.07"
  title: "Input-delay contouring control paper accepted by IEEE TIE"
  content: "Our paper \"[Contouring Error Bounded Control for Biaxial Systems With Structural Flexibility and Input Delay](https://ieeexplore.ieee.org/document/11611918)\" has been accepted by *IEEE Transactions on Industrial Electronics*."

- id: "2026-06-battery-media"
  date: "2026-06-01T00:00:00Z"
  display_date: "2026.06"
  title: "Media coverage of health-aware battery fast charging"
  content: "Our work on lifelong health-aware reinforcement learning for lithium-ion battery fast charging has received broad media coverage, including features by [Chalmers University of Technology](https://www.chalmers.se/en/current/news/e2-ai-extends-ev-battery-lifetime-by-nearly-23-percent-without-increasing-charging-time/) and [IEEE Spectrum](https://spectrum.ieee.org/ev-charging-strategy), highlighting its potential to extend battery lifetime by nearly 23% without increasing charging time."

- id: "2026-01-contouring-switched"
  date: "2026-01-01T00:00:00Z"
  display_date: "2026.01"
  title: "Switched-system contouring control paper accepted by IEEE TSMC"
  content: "Our paper \"[Contouring Error Bounded Control for Biaxial Switched Linear Systems](https://ieeexplore.ieee.org/document/11396470)\" has been accepted by *IEEE Transactions on Systems, Man, and Cybernetics: Systems*."

- id: "2026-01-green-building-energy"
  date: "2026-01-01T00:00:00Z"
  display_date: "2026.01"
  title: "Green-building energy scheduling paper accepted by Applied Energy"
  content: "Our paper \"[Deep reinforcement learning-based energy scheduling for green buildings with heterogeneous stationary and EV batteries](https://www.sciencedirect.com/science/article/pii/S0306261926001157)\" has been accepted by *Applied Energy*."

- id: "2025-10-lifelong-battery-rl"
  date: "2025-10-01T00:00:00Z"
  display_date: "2025.10"
